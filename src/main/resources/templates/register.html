<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand-title {
            color: #0f3460;
            font-weight: 700;
            font-size: 28px;
        }
        .brand-subtitle {
            color: #e94560;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .btn-register {
            background: #0f3460;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            font-size: 16px;
        }
        .btn-register:hover {
            background: #e94560;
            color: white;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1.5px solid #dee2e6;
        }
        .form-control:focus {
            border-color: #0f3460;
            box-shadow: none;
        }
        a { color: #0f3460; font-weight: 600; }
        a:hover { color: #e94560; }
    </style>
</head>
<body>
<div class="register-card">
    <!-- Logo & Title -->
    <div class="text-center mb-4">
        <div style="font-size:48px;">🎓</div>
        <div class="brand-title">CampusConnect</div>
        <div class="brand-subtitle">Create your account</div>
    </div>

    <!-- Error Message -->
    <div th:if="${error}" class="alert alert-danger py-2 text-center" role="alert">
        <span th:text="${error}"></span>
    </div>

    <!-- Register Form -->
    <form th:action="@{/register}" th:object="${student}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input type="text" th:field="*{name}" class="form-control"
                   placeholder="Enter your full name" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" th:field="*{email}" class="form-control"
                   placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Phone Number</label>
            <input type="text" th:field="*{phone}" class="form-control"
                   placeholder="Enter your phone number">
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" th:field="*{password}" class="form-control"
                   placeholder="Create a password" required>
        </div>
        <button type="submit" class="btn-register">Create Account</button>
    </form>

    <div class="text-center mt-3" style="color:#aaa; font-size:13px;">
        Already have an account? <a th:href="@{/login}">Login here</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
