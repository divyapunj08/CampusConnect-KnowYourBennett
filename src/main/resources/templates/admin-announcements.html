<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CampusConnect - Announcements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background:#f4f6fb; font-family:'Segoe UI',sans-serif; }
        .navbar { background:linear-gradient(90deg,#1a1a2e,#16213e); padding:12px 30px; }
        .navbar-brand { color:#fff!important; font-weight:800; font-size:22px; }
        .navbar-brand span { color:#e94560; }
        .nav-link { color:rgba(255,255,255,.85)!important; font-weight:500; padding:8px 16px!important; border-radius:8px; }
        .nav-link:hover { background:rgba(233,69,96,.2); color:#e94560!important; }
        .table-card { background:#fff; border-radius:16px; padding:25px; box-shadow:0 5px 20px rgba(0,0,0,.08); margin-top:30px; }
        .table thead th { background:#1a1a2e; color:#fff; border:none; padding:14px; }
        .btn-add { background:#e94560; color:#fff; border:none; padding:10px 20px; border-radius:10px; font-weight:600; text-decoration:none; }
        .btn-add:hover { background:#0f3460; color:#fff; }
        .btn-edit { background:#0f3460; color:#fff; border:none; padding:5px 12px; border-radius:6px; font-size:12px; text-decoration:none; }
        .btn-delete { background:#dc3545; color:#fff; border:none; padding:5px 12px; border-radius:6px; font-size:12px; text-decoration:none; cursor:pointer; }
        .alert-s { background:#d1e7dd; border:none; border-radius:10px; padding:12px 20px; font-weight:600; color:#0f5132; margin-bottom:15px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand"><i class="bi bi-mortarboard-fill me-2"></i>Campus<span>Connect</span></a>
        <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/announcements}">Announcements</a></li>
            <li class="nav-item ms-2"><a class="nav-link" th:href="@{/logout}" style="background:#e94560;color:white!important;border-radius:8px;">Logout</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <div th:if="${param.saved}" class="alert-s mt-3">✅ Announcement saved!</div>
    <div th:if="${param.deleted}" class="alert-s mt-3">✅ Announcement deleted!</div>

    <div class="table-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 style="font-weight:800;color:#1a1a2e;margin:0;">📢 Manage Announcements</h5>
            <a th:href="@{/admin/announcements/new}" class="btn-add">+ Add Announcement</a>
        </div>

        <div th:if="${announcements == null or announcements.empty}">
            <div class="alert alert-info text-center p-4">No announcements yet. Click Add Announcement!</div>
        </div>

        <table th:if="${announcements != null and !announcements.empty}" class="table table-hover">
            <thead>
            <tr>
                <th>#</th>
                <th>Title</th>
                <th>Category</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="ann, stat : ${announcements}">
                <td th:text="${stat.index + 1}">1</td>
                <td class="fw-semibold" th:text="${ann.title}">Title</td>
                <td th:text="${ann.category}">Category</td>
                <td th:text="${ann.announcementDate}">Date</td>
                <td>
                    <span th:if="${ann.active}" style="color:#28a745;font-weight:600;">Active</span>
                    <span th:if="${!ann.active}" style="color:#888;font-weight:600;">Hidden</span>
                </td>
                <td>
                    <a th:href="@{/admin/announcements/edit/{id}(id=${ann.id})}" class="btn-edit me-1">✏️ Edit</a>
                    <a th:href="@{/admin/announcements/delete/{id}(id=${ann.id})}" class="btn-delete" onclick="return confirm('Delete this announcement?')">🗑️ Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
