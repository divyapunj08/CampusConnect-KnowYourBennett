<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Event Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar {
            background: #0f3460;
            padding: 15px 30px;
        }
        .navbar-brand {
            color: white !important;
            font-weight: 700;
            font-size: 22px;
        }
        .nav-link {
            color: rgba(255,255,255,0.8) !important;
            font-weight: 500;
        }
        .nav-link:hover { color: #e94560 !important; }
        .form-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            max-width: 700px;
            margin: 40px auto;
        }
        .form-title {
            color: #0f3460;
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
            border: 1.5px solid #dee2e6;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0f3460;
            box-shadow: none;
        }
        .btn-save {
            background: #0f3460;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
        }
        .btn-save:hover {
            background: #e94560;
            color: white;
        }
        .btn-cancel {
            background: #f0f2f5;
            color: #0f3460;
            border: none;
            padding: 12px 40px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
        }
        .btn-cancel:hover {
            background: #dee2e6;
            color: #0f3460;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
        <a class="navbar-brand"><i class="bi bi-mortarboard-fill me-2"></i>Campus<span>Connect</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/events/new}">Add Event</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-card">
        <div class="form-title">
            <span th:if="${event.id == null}">➕ Add New Event</span>
            <span th:if="${event.id != null}">✏️ Edit Event</span>
        </div>

        <form th:action="@{/admin/events/save}" th:object="${event}" method="post">
            <!-- Hidden ID for edit -->
            <input type="hidden" th:field="*{id}"/>

            <div class="row">
                <div class="col-md-12 mb-3">
                    <label class="form-label fw-semibold">Event Title</label>
                    <input type="text" th:field="*{title}" class="form-control"
                           placeholder="Enter event title" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea th:field="*{description}" class="form-control"
                          rows="3" placeholder="Enter event description"></textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Date</label>
                    <input type="date" th:field="*{date}" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Time</label>
                    <input type="time" th:field="*{time}" class="form-control" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Venue</label>
                    <input type="text" th:field="*{venue}" class="form-control"
                           placeholder="Enter venue" required>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Category</label>
                        <select th:field="*{category}" class="form-select">
                            <option value="">Select Category</option>
                            <optgroup label="Main University Events">
                                <option value="Fest">Fest</option>
                                <option value="Seminar">Seminar</option>
                                <option value="Competition">Competition</option>
                                <option value="Workshop">Workshop</option>
                                <option value="Sports">Sports</option>
                                <option value="Cultural">Cultural</option>
                            </optgroup>
                            <optgroup label="Tech Club Events">
                                <option value="Club-Tech">Club-Tech Event</option>
                            </optgroup>
                            <optgroup label="Cultural Club Events">
                                <option value="Club-Cultural">Club-Cultural Event</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-semibold">Club Name (if club event)</label>
                        <select th:field="*{clubName}" class="form-select">
                            <option value="">Not a club event</option>
                            <optgroup label="Cultural Clubs">
                                <option value="Ansh">Ansh — Theatre Society</option>
                                <option value="Verve">Verve — Dance Society</option>
                                <option value="Advaita">Advaita — Music Society</option>
                                <option value="Rivaaz">Rivaaz — Traditional Dance</option>
                                <option value="Cerebrum">Cerebrum — Literary Society</option>
                                <option value="Panache">Panache — Fashion Society</option>
                                <option value="Silhouette">Silhouette — Art Club</option>
                                <option value="Pulse">Pulse — Event Management</option>
                                <option value="ISAC">ISAC — Media Club</option>
                                <option value="Astronomy">Astronomy Club</option>
                                <option value="Comedy Club">Comedy Club</option>
                                <option value="Sunset">Sunset — Cinema Club</option>
                                <option value="Cinepeaks">Cinepeaks — Filmmaking</option>
                                <option value="Anime Club">Anime Club</option>
                                <option value="BU Gamers">BU Gamers</option>
                            </optgroup>
                            <optgroup label="Tech Clubs">
                                <option value="CSI">CSI — Computer Society</option>
                                <option value="ACM">ACM — Computing Society</option>
                                <option value="IEEE">IEEE — Engineering Society</option>
                                <option value="GDG">GDG — Google Dev Group</option>
                                <option value="AWS Cloud">AWS Cloud Club</option>
                                <option value="Alan Turing">Alan Turing — AI/ML Club</option>
                                <option value="FullStack">FullStack — Web Dev Club</option>
                                <option value="CodeChef">CodeChef BU</option>
                                <option value="DroneSoc">DroneSoc</option>
                                <option value="FOSS">FOSS — Open Source</option>
                                <option value="WIE IEEE">WIE IEEE</option>
                                <option value="DSS">DSS — Data Science</option>
                                <option value="GFG">GeeksForGeeks BU</option>
                                <option value="DevOps">DevOps Club</option>
                                <option value="QCC">QCC — Quantum Computing</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Max Participants</label>
                <input type="number" th:field="*{maxParticipants}"
                       class="form-control"
                       placeholder="Enter max participants (0 = unlimited)"
                       min="0">
                <small class="text-muted">Enter 0 for unlimited seats</small>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Registration URL (optional)</label>
                <input type="text" th:field="*{registrationUrl}" class="form-control"
                       placeholder="e.g. https://hackculture.io/hackathon/hackaccino">
                <small class="text-muted">Add external registration/Instagram link for this event</small>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Feature this Event?</label>
                <div class="form-check form-switch">
                    <input type="checkbox" name="featured" id="featuredCheck"
                           th:checked="${event.featured}"
                           value="true"
                           class="form-check-input"
                           style="width:50px;height:25px;cursor:pointer;">
                    <label class="form-check-label ms-2 fw-semibold" for="featuredCheck"
                           style="line-height:25px;">
                        Show as Special Featured Banner on Dashboard
                    </label>
                </div>
                <small class="text-muted">Featured events appear as highlighted banners at the top of student dashboard</small>
            </div>
            <div class="d-flex gap-3">
                <button type="submit" class="btn-save">Save Event</button>
                <a th:href="@{/admin/dashboard}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
