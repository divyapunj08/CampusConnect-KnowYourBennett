<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand-title {
            color: #0f3460;
            font-weight: 700;
            font-size: 28px;
        }
        .brand-subtitle {
            color: #e94560;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .btn-login {
            background: #0f3460;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            font-size: 16px;
        }
        .btn-login:hover {
            background: #e94560;
            color: white;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1.5px solid #dee2e6;
        }
        .form-control:focus {
            border-color: #0f3460;
            box-shadow: none;
        }
        .divider {
            color: #aaa;
            font-size: 13px;
        }
        a {
            color: #0f3460;
            font-weight: 600;
        }
        a:hover { color: #e94560; }
    </style>
</head>
<body>
<div class="login-card">
    <!-- Logo & Title -->
    <div class="text-center mb-4">
        <div style="font-size:48px;">🎓</div>
        <div class="brand-title">CampusConnect</div>
        <div class="brand-subtitle">Bennett University</div>
    </div>

    <!-- Error / Success Messages -->
    <div th:if="${param.error}" class="alert alert-danger py-2 text-center" role="alert">
        Invalid email or password!
    </div>
    <div th:if="${param.registered}" class="alert alert-success py-2 text-center" role="alert">
        Registered successfully! Please login.
    </div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <input type="email" name="username" class="form-control"
                   placeholder="Enter your email" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control"
                   placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="text-center mt-3 divider">
        Don't have an account? <a th:href="@{/register}">Register here</a>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
